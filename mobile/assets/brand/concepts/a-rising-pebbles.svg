<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Concept A — Rising Pebbles</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8277FF"/>
      <stop offset="1" stop-color="#4536CF"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BF0C9"/>
      <stop offset="1" stop-color="#1FA877"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9D6FF"/>
      <stop offset="1" stop-color="#3478E0"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB3A7"/>
      <stop offset="1" stop-color="#E85A63"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.55" stop-color="#FFCB4D"/>
      <stop offset="1" stop-color="#E39A12"/>
    </radialGradient>
    <filter id="clay" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="10" dy="26" result="blur"/>
      <feFlood flood-color="#1A1063" flood-opacity="0.45"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- squircle tile -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#bgGlow)"/>

  <!-- soft ground plate -->
  <rect x="176" y="742" width="672" height="72" rx="36" fill="#2E2497" opacity="0.35" filter="url(#blur12)"/>

  <!-- bar 1 (coral) -->
  <g filter="url(#clay)">
    <rect x="214" y="548" width="164" height="236" rx="82" fill="url(#coral)"/>
  </g>
  <rect x="244" y="574" width="46" height="120" rx="23" fill="#FFFFFF" opacity="0.45" filter="url(#blur6)"/>

  <!-- bar 2 (sky) -->
  <g filter="url(#clay)">
    <rect x="430" y="424" width="164" height="360" rx="82" fill="url(#sky)"/>
  </g>
  <rect x="460" y="450" width="46" height="190" rx="23" fill="#FFFFFF" opacity="0.45" filter="url(#blur6)"/>

  <!-- bar 3 (mint) -->
  <g filter="url(#clay)">
    <rect x="646" y="300" width="164" height="484" rx="82" fill="url(#mint)"/>
  </g>
  <rect x="676" y="326" width="46" height="250" rx="23" fill="#FFFFFF" opacity="0.45" filter="url(#blur6)"/>

  <!-- coin resting on the tallest bar -->
  <g filter="url(#clay)">
    <circle cx="728" cy="214" r="96" fill="url(#gold)"/>
  </g>
  <circle cx="728" cy="214" r="64" fill="none" stroke="#E39A12" stroke-width="10" opacity="0.55"/>
  <ellipse cx="700" cy="180" rx="30" ry="20" fill="#FFFFFF" opacity="0.7" filter="url(#blur6)"/>

  <!-- sparkle -->
  <path d="M286 268 l14 38 l38 14 l-38 14 l-14 38 l-14 -38 l-38 -14 l38 -14 z" fill="#FFFFFF" opacity="0.9"/>
</svg>
