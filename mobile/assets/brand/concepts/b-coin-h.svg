<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Concept B — Coin H (Hisaab monogram)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2FA8"/>
      <stop offset="1" stop-color="#1C1660"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#8B82FF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#8B82FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C4F5"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.5" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#D98B0B"/>
    </radialGradient>
    <linearGradient id="mintStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7EEBC2"/>
      <stop offset="1" stop-color="#2BB389"/>
    </linearGradient>
    <filter id="clay" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="10" dy="28" result="blur"/>
      <feFlood flood-color="#05031F" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#bgGlow)"/>

  <!-- left pillar -->
  <g filter="url(#clay)">
    <rect x="228" y="220" width="168" height="584" rx="84" fill="url(#pillar)"/>
  </g>
  <rect x="258" y="248" width="44" height="250" rx="22" fill="#FFFFFF" opacity="0.9" filter="url(#blur6)"/>

  <!-- right pillar -->
  <g filter="url(#clay)">
    <rect x="628" y="220" width="168" height="584" rx="84" fill="url(#pillar)"/>
  </g>
  <rect x="658" y="248" width="44" height="250" rx="22" fill="#FFFFFF" opacity="0.9" filter="url(#blur6)"/>

  <!-- coin crossbar -->
  <g filter="url(#clay)">
    <circle cx="512" cy="512" r="150" fill="url(#gold)"/>
  </g>
  <circle cx="512" cy="512" r="104" fill="none" stroke="#D98B0B" stroke-width="12" opacity="0.5"/>
  <!-- tick mark inside the coin: "accounts settled" -->
  <path d="M458 516 l38 38 l74 -82" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="466" cy="440" rx="44" ry="26" fill="#FFFFFF" opacity="0.65" filter="url(#blur6)"/>

  <!-- mint underline = growth -->
  <rect x="352" y="846" width="320" height="26" rx="13" fill="url(#mintStroke)"/>
</svg>
